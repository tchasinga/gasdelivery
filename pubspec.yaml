name: gasdelivery
description: "Gas Delivery — customer app for ordering LPG"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  image_picker: ^1.2.2
  cross_file: ^0.3.5+2
  google_maps_flutter: ^2.12.1
  google_maps_flutter_android: ^2.14.0
  geolocator: ^13.0.4
  flutter_polyline_points: ^2.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/

